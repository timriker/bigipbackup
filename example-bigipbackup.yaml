# Where UCS files are stored: <backup_dir>/<name>/<name>_<YYYYMMDD-HHMM>.ucs
# <name> is the device's short name from the list below when all devices share one
# domain, else the full name as listed (e.g. lb1.example.com and lb1.example.net).
backup_dir: backups
# Delete local UCS files older than this many days (by file mtime)
retention_days: 56
log_file: bigipbackup.log
# true, false, or a path to a CA bundle that signs the BIG-IP mgmt certs
verify_tls: true
# "tmos" works for local and system-configured remote auth (TACACS/RADIUS/LDAP)
login_provider: tmos
# How many devices to back up at the same time (-j/--jobs overrides)
max_threads: 4
# Management addresses/hostnames (optionally host:port). Include BOTH members of each HA pair.
devices:
  - bigip01a.example.org
  - bigip01b.example.org
